[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "consulwire"
dynamic = ["version"]
description = "Strictly typed sync/async Consul client, with Flask, FastAPI, Django and gunicorn integrations that register the application."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enzo Caceres", email = "enzo.caceres@crunchdao.com" }]
keywords = ["consul", "service-discovery", "service-registry", "key-value", "flask", "fastapi", "starlette", "django", "gunicorn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.0",
    "httpx>=0.27",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
flask = ["flask>=2.2"]
fastapi = ["starlette>=0.27"]
django = ["django>=4.2"]

[project.urls]
Homepage = "https://github.com/crunchdao/consulwire"
Documentation = "https://github.com/crunchdao/consulwire#readme"
Repository = "https://github.com/crunchdao/consulwire"
Issues = "https://github.com/crunchdao/consulwire/issues"
Changelog = "https://github.com/crunchdao/consulwire/releases"

[dependency-groups]
dev = [
    "anyio>=4.0",
    "basedpyright>=1.20",
    "django>=4.2",
    "django-stubs>=5.0",
    "fastapi>=0.110",
    "flask>=3.0",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "uvicorn>=0.30",
]

[tool.hatch.version]
path = "src/consulwire/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/consulwire"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "anyio"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["consulwire"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise AssertionError",
    "assert_never\\(",
    "class .*\\(Protocol\\):",
]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "examples"]
mypy_path = "src"
explicit_package_bases = true # each example has its own app.py or main.py
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = false # pytest.fixture and Flask's decorators are typed as returning Any
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
# Optional imports can reach stubs written for Python >= 3.12 when those packages happen to be
# installed. None of them are dependencies.
module = ["IPython", "IPython.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# --------------------------------------------------------------------------- basedpyright

[tool.basedpyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "all"
reportImplicitStringConcatenation = false # conflicts with ruff's formatter

[[tool.basedpyright.executionEnvironments]]
root = "examples"
reportUnusedCallResult = false # ConsulExtension(application, ...), like the README

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # no license chosen yet; drop this once one is
    "COM812", # formatter-managed
    "D105",   # magic methods: their docstring would only describe Python itself
    "D107",   # __init__: documented when its arguments need it
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # docstrings in tests are noise
    "PLR2004", # magic values are the point of assertions
    "S101",    # assert is how pytest works
    "S104",    # binding to all interfaces is what the services do
    "S105",    # fake secrets
    "S106",
]
"examples/**" = [
    "D103",   # the routes say what they do
    "INP001", # applications, not packages
    "S104",   # binding to all interfaces is what the services do
    "S105",   # fake secrets
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"
