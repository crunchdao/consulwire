name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the distributions
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        run: |
          version="$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/consulwire/_version.py").read_text()).group(1))')"

          # The tag is the bare version, such as `0.1.0`.
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::the release tag ${GITHUB_REF_NAME} does not match the package version ${version} (expected ${version})"
            exit 1
          fi

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the distributions
        run: twine check --strict dist/*

      - name: Store the distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Trusted publishing: PyPI trusts this workflow and environment, no API token is stored.
    environment:
      name: pypi
      url: https://pypi.org/p/consulwire

    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  attach:
    name: Attach the distributions to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Upload the distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}"
